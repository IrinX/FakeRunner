// 根 build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle Plugin，使用 8.x 以支持 API 102 的 AndroidX
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
